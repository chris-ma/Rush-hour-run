<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Rush Hour Run</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #111114; overflow: hidden; }

    /* Phaser canvas container */
    #game-root { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
    canvas { display: block; touch-action: none;
             image-rendering: pixelated; image-rendering: crisp-edges; }

    /* ── Shared overlay base ─────────────────────────────── */
    .screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
    }

    /* ── HTML Menu ───────────────────────────────────────── */
    #html-menu { background: #111114; display: flex; }

    #html-menu .title {
      font-family: 'Press Start 2P', monospace;
      text-align: center; line-height: 1.6;
    }
    #html-menu .title .line1 { font-size: 38px; color: #eecc44; display: block; }
    #html-menu .title .line2 { font-size: 38px; color: #eecc44; display: block; }
    #html-menu .title .line3 { font-size: 38px; color: #ee4444; display: block; }

    #html-menu .tagline {
      font-family: 'Press Start 2P', monospace;
      font-size: 9px; color: #666660;
    }
    #html-best {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px; color: #66aaff;
      min-height: 1.4em;
    }

    /* ── Shared button style ─────────────────────────────── */
    .rhr-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 15px;
      color: #ffffff;
      background: #1a1a20;
      border: 3px solid rgba(255,255,255,0.55);
      padding: 16px 32px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      letter-spacing: 1px;
    }
    .rhr-btn:active { background: #333340; }
    .rhr-btn.dim { color: #aaaaaa; border-color: rgba(170,170,170,0.4); }

    #html-menu .hint {
      font-family: 'Press Start 2P', monospace;
      font-size: 8px; color: #333338; text-align: center;
    }

    /* ── Game-Over DOM buttons ───────────────────────────── */
    #html-gameover {
      pointer-events: none;      /* pass-through except for buttons */
      justify-content: flex-end;
      padding-bottom: 22%;
      gap: 18px;
    }
    #html-gameover .rhr-btn { pointer-events: all; }
  </style>
</head>
<body>

  <!-- Phaser renders here (always present, covered by menu until play) -->
  <div id="game-root"></div>

  <!-- ── HTML Menu (pure DOM — zero Phaser dependency) ──── -->
  <div id="html-menu" class="screen">
    <div class="title">
      <span class="line1">RUSH</span>
      <span class="line2">HOUR</span>
      <span class="line3">RUN</span>
    </div>
    <div class="tagline">DON'T BE LATE</div>
    <div id="html-best"></div>
    <button id="btn-play" class="rhr-btn">TAP TO PLAY</button>
    <div class="hint">DRAG LOWER HALF OF SCREEN TO MOVE</div>
  </div>

  <!-- ── Game-Over buttons (shown over Phaser canvas) ───── -->
  <div id="html-gameover" class="screen">
    <button id="btn-retry"  class="rhr-btn">[ RETRY ]</button>
    <button id="btn-to-menu" class="rhr-btn dim">[ MENU ]</button>
  </div>

  <script>
    // ── helpers ──────────────────────────────────────────
    function el(id) { return document.getElementById(id); }

    function showMenu() {
      var best = parseInt(localStorage.getItem('rushHourRun_highestLevel') || '0', 10);
      el('html-best').textContent = best > 0 ? 'BEST: LEVEL ' + best : '';
      el('html-gameover').style.display = 'none';
      el('html-menu').style.display = 'flex';
    }

    function hideMenu() {
      el('html-menu').style.display = 'none';
    }

    // Called by GameOverScene.create() to surface retry/menu buttons
    window.RHR_showGameOver = function () {
      el('html-menu').style.display = 'none';
      el('html-gameover').style.display = 'flex';
    };

    // ── button wiring ─────────────────────────────────────
    function on(id, fn) {
      var b = el(id);
      b.addEventListener('touchstart', function (e) {
        e.preventDefault(); fn();
      }, { passive: false });
      b.addEventListener('click', fn);
    }

    on('btn-play', function () {
      hideMenu();
      // Phaser is already initialised; just start the game scene
      if (window.RHR) window.RHR.scene.start('Game', { level: 1 });
    });

    on('btn-retry', function () {
      el('html-gameover').style.display = 'none';
      if (window.RHR) {
        window.RHR.scene.stop('GameOver');
        window.RHR.scene.start('Game', { level: 1 });
      }
    });

    on('btn-to-menu', function () {
      el('html-gameover').style.display = 'none';
      if (window.RHR) window.RHR.scene.stop('GameOver');
      showMenu();
    });

    // Show menu on first load
    showMenu();
  </script>

  <!-- Phaser + game scripts -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <script src="src/constants.js"></script>
  <script src="src/scenes/BootScene.js"></script>
  <script src="src/scenes/GameScene.js"></script>
  <script src="src/scenes/GameOverScene.js"></script>
  <script src="src/main.js"></script>

  <!-- Native DOM joystick — bypasses Phaser input for mobile compatibility -->
  <script>
    window.RHR_joy = { active: false, ox: 0, oy: 0, vx: 0, vy: 0, kx: 0, ky: 0 };
    var _joyTouchId = null;

    function _joyCanvas() { return document.querySelector('#game-root canvas'); }

    function _joyToLogical(cx, cy) {
      var canvas = _joyCanvas();
      if (!canvas) return { x: cx, y: cy };
      var r = canvas.getBoundingClientRect();
      return {
        x: (cx - r.left) * (C.WIDTH  / r.width),
        y: (cy - r.top)  * (C.HEIGHT / r.height),
      };
    }

    function _joyGameActive() {
      return window.RHR && window.RHR.scene && window.RHR.scene.isActive('Game');
    }

    document.addEventListener('touchstart', function(e) {
      if (!_joyGameActive() || _joyTouchId !== null) return;
      var t = e.changedTouches[0];
      var p = _joyToLogical(t.clientX, t.clientY);
      if (p.y < C.JOY_ZONE_Y) return;
      e.preventDefault();
      _joyTouchId = t.identifier;
      var j = window.RHR_joy;
      j.active = true; j.ox = p.x; j.oy = p.y;
      j.vx = 0; j.vy = 0; j.kx = p.x; j.ky = p.y;
    }, { passive: false });

    document.addEventListener('touchmove', function(e) {
      if (_joyTouchId === null) return;
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        if (t.identifier !== _joyTouchId) continue;
        e.preventDefault();
        var p = _joyToLogical(t.clientX, t.clientY);
        var j = window.RHR_joy;
        var dx = p.x - j.ox, dy = p.y - j.oy;
        var dist = Math.sqrt(dx * dx + dy * dy);
        var clamped = Math.min(dist, C.JOY_MAX);
        var angle = Math.atan2(dy, dx);
        j.kx = j.ox + Math.cos(angle) * clamped;
        j.ky = j.oy + Math.sin(angle) * clamped;
        if (dist > C.JOY_DEAD) {
          var norm = clamped / C.JOY_MAX;
          j.vx = Math.cos(angle) * norm;
          j.vy = Math.sin(angle) * norm;
        } else { j.vx = 0; j.vy = 0; }
        break;
      }
    }, { passive: false });

    function _joyReset() {
      _joyTouchId = null;
      window.RHR_joy.active = false;
      window.RHR_joy.vx = 0;
      window.RHR_joy.vy = 0;
    }

    document.addEventListener('touchend',    function(e) {
      for (var i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === _joyTouchId) { _joyReset(); break; }
      }
    }, { passive: false });

    document.addEventListener('touchcancel', function(e) {
      for (var i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === _joyTouchId) { _joyReset(); break; }
      }
    }, { passive: false });
  </script>
</body>
</html>
